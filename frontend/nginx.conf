# One origin: static bundle, /api, /auth, /health, and Socket.io all answer
# from here, so the browser never sees a cross-origin request and CORS stays a
# fallback rather than a requirement.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints everything under /assets/ — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached heuristically: a stale shell loads old
    # asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API, OAuth, and health — no path rewrite; Express already owns these.
    location ~ ^/(api|auth|health)(/|$) {
        proxy_pass http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io needs the protocol upgrade, and long read timeouts so an idle
    # board tab's pings are never cut mid-flight.
    location /socket.io/ {
        proxy_pass http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback: every unknown path is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
