<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Start the one font before the stylesheet is parsed, so text paints in
         Hanken Grotesk instead of flashing the fallback first. `crossorigin` is
         required even though the file is same-origin: fonts are always
         fetched in CORS mode, and a preload without it is fetched twice. -->
    <link rel="preload" href="/fonts/hanken-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>FlowBoard — real-time collaborative Kanban</title>
    <!-- Resolve the theme before the first paint. If this waited for React, a
         user who chose light would see the dark tokens flash first; if it ran
         only in an effect, the same flash would appear on every reload.
         It lives in public/theme-boot.js rather than inline here because the
         API's `script-src 'self'` CSP blocks inline scripts — see the comment
         in that file. A classic <script src> in <head> blocks parsing, so
         <html data-theme> is set before <body> can be painted. -->
    <script src="/theme-boot.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
