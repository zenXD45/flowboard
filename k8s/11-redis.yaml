# Redis — stateless, so a plain Deployment. It exists to carry the Socket.io
# pub/sub adapter across backend replicas; losing it loses broadcasts between
# instances, not data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: flowboard
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: flowboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: flowboard
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: flowboard
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: flowboard
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
