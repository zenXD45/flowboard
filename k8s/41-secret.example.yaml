# TEMPLATE — never commit real values.
#   cp k8s/41-secret.example.yaml k8s/41-secret.yaml   (gitignored)
#   kubectl apply -f k8s/41-secret.yaml
# Or generate JWT_SECRET instead of inventing one:
#   kubectl -n flowboard create secret generic flowboard-secret \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32)
apiVersion: v1
kind: Secret
metadata:
  name: flowboard-secret
  namespace: flowboard
  labels:
    app.kubernetes.io/part-of: flowboard
type: Opaque
stringData:
  JWT_SECRET: "replace-me-with-a-long-random-value"
  # Empty = provider button hidden (the app degrades to password sign-in).
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
