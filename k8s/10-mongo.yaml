# MongoDB — a StatefulSet with a per-instance claim, because data outlives a
# pod and a Deployment's pod could land on a different node with an empty disk.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: flowboard
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: flowboard
spec:
  clusterIP: None          # headless: stable DNS per StatefulSet ordinal
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: flowboard
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: flowboard
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        app.kubernetes.io/part-of: flowboard
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - name: mongo
              containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 4
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName: the cluster's default class provisions this
        # (kind ships local-path "standard"; clouds ship their own).
        resources:
          requests:
            storage: 1Gi
