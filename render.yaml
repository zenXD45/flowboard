services:
  - type: web
    name: flowboard-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Free instances sleep after ~15 idle minutes; this keeps /health warm.
      - key: SELF_PING
        value: "on"
      # Social sign-in. PUBLIC_URL must be the service's own origin (no
      # trailing slash) because it builds the OAuth redirect_uri. Set these in
      # the dashboard, not here: leaving a client secret in this file, even a
      # private one, means it lands in git.
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
